name: Microsoft Store packages
on:
  workflow_dispatch:
  pull_request:
  workflow_call:
    inputs:
      package_version:
        type: string
        default: 1.0.3
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    concurrency:
      group: store-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install Windows POSIX build tools
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS
          install: make pkgconf
          path-type: inherit
      - name: Verify registered identity and build self-contained Store bundle
        run: python tools/package-store.py --version ${{ inputs.package_version || '1.0.3' }}
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
      - name: Install a disposable signed Store copy and verify Shell file activation
        shell: pwsh
        timeout-minutes: 5
        run: tools/smoke-store.ps1 -Version "${{ inputs.package_version || '1.0.3' }}"
      - uses: actions/upload-artifact@v4
        with:
          name: store-upload
          path: |
            artifacts/*-store.msixupload
            artifacts/*-store.msixbundle
            artifacts/store-submission.json
            artifacts/store-listing.zip
