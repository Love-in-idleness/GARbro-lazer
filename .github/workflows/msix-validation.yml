name: MSIX validation
on:
  push:
    paths: [.github/workflows/msix-validation.yml]
  workflow_dispatch:
    inputs:
      version:
        description: Package version to validate without publishing
        type: string
        default: 1.1.3
permissions:
  contents: read
concurrency:
  group: msix-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install Windows media build tools
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS
          install: make pkgconf
          path-type: inherit
      - uses: actions/cache/restore@v4
        with:
          path: artifacts/media/win-*
          key: media-store-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/build-media.py', 'tools/media-codecs.json') }}
          restore-keys: media-store-${{ runner.os }}-${{ runner.arch }}-
      - run: python tools/build-media.py --rid win-x64
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
      - shell: bash
        run: python tools/package-release.py --rid win-x64 --version "$GARBRO_PACKAGE_VERSION" --installer
        env:
          GARBRO_PACKAGE_VERSION: ${{ inputs.version || '1.1.3' }}
      - name: Prepare the lower-version upgrade fixture
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/package-msix.ps1 -Stage "artifacts/msix-root-${{ inputs.version || '1.1.3' }}-x64" -Output artifacts -Version "${{ inputs.version || '1.1.3' }}" -PrepareUpgradeTest
      - shell: pwsh
        run: tools/smoke-msix.ps1 -Output artifacts -Version "${{ inputs.version || '1.1.3' }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: msix-validation
          path: |
            artifacts/*.zip
            artifacts/*.msix
            artifacts/*.cer
            artifacts/msix-test/
